spring.application.name=autoloc-api

# Serveur
server.port=8081
server.servlet.context-path=/api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# MariaDB (XAMPP) est vu comme "5.5" par le pilote MySQL : on indique la vraie version
spring.jpa.properties.jakarta.persistence.database-major-version=10
spring.jpa.properties.jakarta.persistence.database-minor-version=4
# Provisoire (jusqu'aux DTO) : la session reste ouverte pendant la sérialisation JSON des associations LAZY
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO